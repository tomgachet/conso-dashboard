name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run tests
        run: |
          go test ./...
          bash -n deploy/systemd/conso-dashboard-ctl
          bash -n install.sh
          python3 tests/systemd_ctl_test.py
          python3 tests/install_test.py

      - name: Build release archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/linux-amd64
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/linux-amd64/conso-dashboard .
          glibc_limit=2.39
          glibc_required=$(readelf --version-info dist/linux-amd64/conso-dashboard | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | cut -d_ -f2 | sort -V | tail -n 1)
          echo "Binary requires glibc ${glibc_required}"
          if [[ $(printf '%s\n' "$glibc_required" "$glibc_limit" | sort -V | tail -n 1) != "$glibc_limit" ]]; then
            echo "Binary exceeds the glibc ${glibc_limit} compatibility limit" >&2
            exit 1
          fi
          test "$(dist/linux-amd64/conso-dashboard version)" = "conso-dashboard ${VERSION}"
          cp LICENSE README.md .env.example install.sh dist/linux-amd64/
          mkdir -p dist/linux-amd64/deploy
          cp -R deploy/systemd dist/linux-amd64/deploy/
          tar -C dist/linux-amd64 -czf dist/conso-dashboard-linux-amd64.tar.gz conso-dashboard LICENSE README.md .env.example install.sh deploy
          cd dist
          sha256sum conso-dashboard-linux-amd64.tar.gz > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/conso-dashboard-linux-amd64.tar.gz
            dist/SHA256SUMS
