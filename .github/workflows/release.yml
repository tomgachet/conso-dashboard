name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build release archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist/linux-amd64
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o dist/linux-amd64/conso-dashboard .
          cp LICENSE dist/linux-amd64/LICENSE
          tar -C dist/linux-amd64 -czf dist/conso-dashboard-linux-amd64.tar.gz conso-dashboard LICENSE
          cd dist
          sha256sum conso-dashboard-linux-amd64.tar.gz > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/conso-dashboard-linux-amd64.tar.gz
            dist/SHA256SUMS
