<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Consommation électrique</title>
  <style>
    :root{color-scheme:dark;--bg:#09111f;--panel:#111d31;--line:#263854;--text:#edf6ff;--muted:#91a4bd;--accent:#4dd4a5}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#183451,transparent 35%),var(--bg);color:var(--text);font:16px system-ui,sans-serif}.wrap{width:min(1000px,calc(100% - 32px));margin:48px auto}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap}.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.eyebrow{color:var(--accent);font-size:.75rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,4rem);line-height:1;margin:.3rem 0 0}select,.view-toggle button,.back{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit}.view-toggle{display:flex;gap:4px}.view-toggle button,.back{cursor:pointer}.view-toggle button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#052016;font-weight:700}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:28px 0}.card{background:var(--panel);padding:22px}.card span{color:var(--muted);font-size:.78rem;text-transform:uppercase}.card strong{display:block;font-size:1.8rem;margin-top:8px}.panel{background:rgba(17,29,49,.94);border:1px solid var(--line);border-radius:18px;padding:22px}.panel-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}.panel-title{font-size:1.05rem;margin:0;text-transform:capitalize}.chart{width:100%;height:auto;min-height:280px}.axis,.grid{stroke:var(--line);stroke-width:1}.grid{opacity:.55}.bar{fill:var(--accent);cursor:pointer}.bar:hover{fill:#83efc9}.day-label,.value-label{fill:var(--muted);font-size:10px}.daily-list{width:100%;border-collapse:collapse}.daily-list th,.daily-list td{padding:13px 10px;border-bottom:1px solid var(--line)}.daily-list th{text-align:left;color:var(--muted);font-size:.75rem;text-transform:uppercase}.daily-list th:last-child,.daily-list td:last-child{text-align:right}.daily-list tbody tr{cursor:pointer;transition:filter .15s ease}.daily-list tbody tr:hover{filter:brightness(1.2)}.daily-list tbody tr:last-child td{border-bottom:0}.daily-list .day{font-weight:650;text-transform:capitalize}.daily-list .date{color:var(--muted);font-size:.85rem;margin-left:8px}.daily-list .consumption{font-variant-numeric:tabular-nums;font-weight:700}.status{color:var(--muted);margin-top:12px}.error{color:#ff9d9d}.hidden{display:none}@media(max-width:620px){.wrap{margin:28px auto}.cards{grid-template-columns:1fr}.controls{width:100%;justify-content:space-between}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div><div class="eyebrow">Compteur Linky</div><h1>Consommation</h1></div><div class="controls"><label>Période <select id="days"><option value="7">7 jours</option><option value="30" selected>30 jours</option><option value="90">90 jours</option></select></label><div class="view-toggle" aria-label="Mode d'affichage"><button type="button" data-view="chart" aria-pressed="true">Graphique</button><button type="button" data-view="list" aria-pressed="false">Liste</button></div></div></header>
  <section class="cards"><div class="card"><span>Total</span><strong id="total">—</strong></div><div class="card"><span id="average-label">Moyenne / jour</span><strong id="average">—</strong></div><div class="card"><span>Maximum</span><strong id="maximum">—</strong></div></section>
  <section id="chart-panel" class="panel"><div class="panel-header"><h2 id="chart-title" class="panel-title">Consommation quotidienne</h2><button type="button" class="back hidden">← Retour</button></div><svg id="chart" class="chart" viewBox="0 0 900 340" role="img" aria-label="Consommation"></svg></section>
  <section id="list-panel" class="panel hidden"><div class="panel-header"><h2 id="list-title" class="panel-title">Consommation quotidienne</h2><button type="button" class="back hidden">← Retour</button></div><table class="daily-list"><thead><tr><th id="first-column">Jour</th><th>Consommation</th></tr></thead><tbody id="daily-list"></tbody></table></section>
  <div id="status" class="status">Chargement…</div>
</main><script>
const svg=document.querySelector('#chart'),list=document.querySelector('#daily-list'),status=document.querySelector('#status'),number=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}),format=n=>number.format(n)+' kWh',shortDay=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric'}),weekday=new Intl.DateTimeFormat('fr-FR',{weekday:'long'}),calendarDate=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}),longDay=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}),svgElement=name=>document.createElementNS('http://www.w3.org/2000/svg',name);
let dailyData=[];
function setDetailMode(day){const detail=Boolean(day),date=detail?new Date(day+'T12:00:00'):null,title=detail?longDay.format(date):'Consommation quotidienne';document.querySelector('#chart-title').textContent=title;document.querySelector('#list-title').textContent=title;document.querySelector('#first-column').textContent=detail?'Heure':'Jour';document.querySelector('#average-label').textContent=detail?'Moyenne / créneau':'Moyenne / jour';document.querySelectorAll('.back').forEach(button=>button.classList.toggle('hidden',!detail));document.querySelector('#days').disabled=detail}
function drawAxes(max){svg.innerHTML='';for(let tick=0;tick<=4;tick++){const y=270-tick/4*230,line=svgElement('line'),label=svgElement('text');line.setAttribute('class',tick===0?'axis':'grid');line.setAttribute('x1',55);line.setAttribute('x2',885);line.setAttribute('y1',y);line.setAttribute('y2',y);svg.append(line);label.setAttribute('class','value-label');label.setAttribute('x',48);label.setAttribute('y',y+3);label.setAttribute('text-anchor','end');label.textContent=number.format(max*tick/4);svg.append(label)}}
function render(data,detail=false){const total=data.reduce((sum,p)=>sum+p.kwh,0),max=Math.max(0,...data.map(p=>p.kwh));document.querySelector('#total').textContent=format(total);document.querySelector('#average').textContent=format(data.length?total/data.length:0);document.querySelector('#maximum').textContent=format(max);drawAxes(max);list.innerHTML='';const width=830/Math.max(data.length,1),labelStep=detail?4:(data.length>30?Math.ceil(data.length/15):1);data.forEach((point,index)=>{const height=max?point.kwh/max*230:0,x=55+index*width+1,bar=svgElement('rect'),labelText=detail?point.time:shortDay.format(new Date(point.day+'T12:00:00'));bar.setAttribute('class','bar');bar.setAttribute('x',x);bar.setAttribute('y',270-height);bar.setAttribute('width',Math.max(2,width-3));bar.setAttribute('height',height);const title=svgElement('title');title.textContent=(detail?point.time:longDay.format(new Date(point.day+'T12:00:00')))+' · '+format(point.kwh);bar.append(title);if(!detail)bar.addEventListener('click',()=>loadDay(point.day));svg.append(bar);if(index%labelStep===0){const label=svgElement('text'),labelX=x+Math.max(2,width-3)/2;label.setAttribute('class','day-label');label.setAttribute('x',labelX);label.setAttribute('y',286);label.setAttribute('text-anchor','end');label.setAttribute('transform',`rotate(-45 ${labelX} 286)`);label.textContent=labelText;svg.append(label)}const row=document.createElement('tr'),name=document.createElement('td'),value=document.createElement('td'),intensity=max?point.kwh/max:0,hue=120*(1-intensity);row.style.backgroundColor=`hsla(${hue},75%,45%,${.07+intensity*.18})`;row.style.boxShadow=`inset 4px 0 hsl(${hue},75%,48%)`;if(detail){name.textContent=point.time}else{const date=new Date(point.day+'T12:00:00');name.innerHTML=`<span class="day">${weekday.format(date)}</span><span class="date">${calendarDate.format(date)}</span>`;row.addEventListener('click',()=>loadDay(point.day))}value.className='consumption';value.textContent=format(point.kwh);row.append(name,value);if(detail)list.append(row);else list.prepend(row)});const noun=detail?(data.length>1?'créneaux':'créneau'):(data.length>1?'journées':'journée');status.textContent=data.length+' '+noun+' affiché'+(data.length>1?'s':'')}
async function fetchJSON(url){const response=await fetch(url),data=await response.json();if(!response.ok)throw new Error(data.error);return data}
async function load(){status.className='status';status.textContent='Chargement…';try{dailyData=await fetchJSON('/api/daily?days='+document.querySelector('#days').value);setDetailMode(null);render(dailyData)}catch(error){status.className='status error';status.textContent=error.message}}
async function loadDay(day){status.className='status';status.textContent='Chargement…';try{const data=await fetchJSON('/api/intervals?day='+day);setDetailMode(day);render(data,true)}catch(error){status.className='status error';status.textContent=error.message}}
document.querySelector('#days').addEventListener('change',load);document.querySelectorAll('.back').forEach(button=>button.addEventListener('click',()=>{setDetailMode(null);render(dailyData)}));document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{const view=button.dataset.view;document.querySelector('#chart-panel').classList.toggle('hidden',view!=='chart');document.querySelector('#list-panel').classList.toggle('hidden',view!=='list');document.querySelectorAll('[data-view]').forEach(item=>item.setAttribute('aria-pressed',item===button))}));load();
</script></body></html>
