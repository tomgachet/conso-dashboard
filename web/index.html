function calendarColor(intensity){return calendarPalette==='green'?`hsl(153,70%,${10+intensity*52}%)`:`hsl(${120*(1-intensity)},75%,${28+intensity*10}%)`}
function renderCalendar(){calendar.innerHTML='';const year=Number(document.querySelector('#calendar-year').value),points=new Map(calendarData.map(point=>[point.day,point])),max=Math.max(0,...calendarData.map(point=>point.kwh)),months=Array.from({length:12},(_,index)=>`${year}-${String(index+1).padStart(2,'0')}`);document.querySelector('#calendar-range').textContent=String(year);document.querySelector('.calendar-gradient').style.background=calendarPalette==='green'?'linear-gradient(90deg,hsl(153,70%,10%),hsl(153,70%,62%))':'linear-gradient(90deg,hsl(120,75%,32%),hsl(60,75%,38%),hsl(0,75%,40%))';months.forEach(month=>{const [year,monthNumber]=month.split('-').map(Number),start=new Date(year,monthNumber-1,1,12),days=new Date(year,monthNumber,0).getDate(),section=document.createElement('section'),heading=document.createElement('h3'),weekdays=document.createElement('div'),grid=document.createElement('div');section.className='calendar-month';heading.textContent=monthDate.format(start);weekdays.className='calendar-weekdays';['L','M','M','J','V','S','D'].forEach(name=>{const label=document.createElement('span');label.textContent=name;weekdays.append(label)});grid.className='calendar-grid';for(let blank=0;blank<(start.getDay()+6)%7;blank++){const cell=document.createElement('span');cell.className='calendar-day outside';grid.append(cell)}for(let day=1;day<=days;day++){const date=new Date(year,monthNumber-1,day,12),key=dateKey(date),point=points.get(key),cell=document.createElement(point?'button':'span'),dayNumber=document.createElement('span');dayNumber.textContent=day;cell.className='calendar-day';cell.append(dayNumber);if(point){const value=document.createElement('small'),intensity=max?point.kwh/max:0;cell.type='button';cell.style.backgroundColor=calendarColor(intensity);cell.title=`${longDay.format(date)} · ${format(point.kwh)}`;value.textContent=number.format(point.kwh);cell.append(value);cell.addEventListener('click',()=>{selectMode('data');loadDay(key)})}else{cell.classList.add('missing');cell.title='Aucune donnée'}grid.append(cell)}section.append(heading,weekdays,grid);calendar.append(section)});status.textContent=calendarData.length?`${calendarData.length} jours affichés`:`Aucune donnée pour ${year}`}
function selectPalette(palette){calendarPalette=palette;document.querySelectorAll('[data-palette]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.palette===palette));renderCalendar()}
function selectMode(mode){const calendarMode=mode==='calendar',dashboardTitle=document.querySelector('#dashboard-title'),calendarPanel=document.querySelector('#calendar-panel');document.querySelector('#data-content').classList.toggle('hidden',calendarMode);document.querySelector('#calendar-period').classList.toggle('hidden',!calendarMode);calendarPanel.classList.toggle('hidden',!calendarMode);document.querySelectorAll('.data-control').forEach(control=>control.classList.toggle('hidden',calendarMode));document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',button.dataset.mode===mode));if(calendarMode){calendarPanel.after(status);dashboardTitle.textContent='';dashboardTitle.classList.add('hidden');loadCalendar()}else{document.querySelector('.primary').append(status);setDetailMode(null)}}
async function fetchJSON(url){const response=await fetch(url),data=await response.json();if(!response.ok)throw new Error(data.error);return data}
async function loadInfo(){try{const info=await fetchJSON('/api/info');document.querySelector('#prm').textContent='· PRM '+info.prm}catch(error){console.error(error)}}
async function load(){status.className='status';status.textContent='Chargement…';try{const period=document.querySelector('#period').value;dailyData=await fetchJSON('/api/daily?period='+period);document.querySelector('#dashboard-layout').classList.toggle('year',period==='year');setDetailMode(null);render(groupData(dailyData))}catch(error){status.className='status error';status.textContent=error.message}}
async function loadCalendar(){status.className='status';status.textContent='Chargement…';try{const year=document.querySelector('#calendar-year').value;calendarData=await fetchJSON('/api/daily?year='+encodeURIComponent(year));renderCalendar()}catch(error){status.className='status error';status.textContent=error.message}}
async function loadDay(day){status.className='status';status.textContent='Chargement…';try{const data=await fetchJSON('/api/intervals?day='+day);setDetailMode(day);render(data,true)}catch(error){status.className='status error';status.textContent=error.message}}
dashboardLayout.addEventListener('transitionend',()=>{if(!dashboardLayout.classList.contains('stats-collapsed'))syncStatsHeight()});
focusToggle.addEventListener('click',()=>{const enabled=focusToggle.getAttribute('aria-pressed')!=='true';focusToggle.setAttribute('aria-pressed',String(enabled));svg.classList.toggle('focus-enabled',enabled)});svg.classList.add('focus-enabled');document.querySelector('#calendar-year').value=new Date().getFullYear();document.querySelector('#period').addEventListener('change',load);document.querySelector('#calendar-year').addEventListener('change',loadCalendar);document.querySelectorAll('[data-year-step]').forEach(button=>button.addEventListener('click',()=>{const input=document.querySelector('#calendar-year'),next=Number(input.value)+Number(button.dataset.yearStep);input.value=Math.min(Number(input.max),Math.max(Number(input.min),next));loadCalendar()}));groupingSelect.addEventListener('change',()=>{setDetailMode(null);render(groupData(dailyData))});document.querySelectorAll('.back').forEach(button=>button.addEventListener('click',()=>{setDetailMode(null);render(groupData(dailyData))}));document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>selectMode(button.dataset.mode)));document.querySelectorAll('[data-palette]').forEach(button=>button.addEventListener('click',()=>selectPalette(button.dataset.palette)));statsToggle.addEventListener('click',()=>{const collapsed=dashboardLayout.classList.toggle('stats-collapsed'),label=collapsed?'Déplier les statistiques':'Replier les statistiques';statsToggle.textContent=collapsed?'→':'←';statsToggle.setAttribute('aria-expanded',String(!collapsed));statsToggle.setAttribute('aria-label',label);statsToggle.title=label;if(!collapsed)requestAnimationFrame(syncStatsHeight)});dataDetails.addEventListener('toggle',()=>{if(!dataDetails.open)requestAnimationFrame(syncStatsHeight)});window.addEventListener('resize',syncStatsHeight);loadInfo();load();requestAnimationFrame(syncStatsHeight);
</script></body></html>
