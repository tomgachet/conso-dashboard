    .mode-toggle,.palette-toggle{display:flex;gap:4px}.mode-toggle button,.palette-toggle button{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);cursor:pointer;padding:10px 12px;font:inherit}.mode-toggle button[aria-pressed="true"],.palette-toggle button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#052016;font-weight:700}.palette-toggle button{font-size:.78rem;padding:7px 9px}.calendar-panel{margin-top:28px}.year-control input{width:7rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font:inherit}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div><div class="eyebrow">Compteur Linky <span id="prm" class="prm"></span></div><h1>Consommation</h1></div><div class="controls"><div class="mode-toggle" aria-label="Vue principale"><button type="button" data-mode="data" aria-pressed="true">Données</button><button type="button" data-mode="calendar" aria-pressed="false">Calendrier</button></div><label class="data-control">Période <select id="period"><option value="week">Semaine en cours</option><option value="month" selected>Mois en cours</option><option value="year">Année en cours</option></select></label><label class="data-control">Regroupement <select id="grouping"><option value="day">Jour</option><option value="week">Semaine</option><option value="month">Mois</option></select></label><div class="view-toggle data-control" aria-label="Mode d'affichage"><button type="button" data-view="chart" aria-pressed="true">Graphique</button><button type="button" data-view="list" aria-pressed="false">Liste</button></div><label class="year-control hidden">Année <input id="calendar-year" type="number" min="2000" max="9999" step="1"></label></div></header>
  <div id="data-content"><section class="cards"><div class="card"><span>Total</span><strong id="total">—</strong></div><div class="card"><span id="average-label">Moyenne / jour</span><strong id="average">—</strong></div><div class="card"><span class="metric-label"><svg class="metric-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 7 6 6 4-4 8 8"></path><path d="M15 17h6v-6"></path></svg>Minimum</span><strong id="minimum">—</strong></div><div class="card"><span class="metric-label"><svg class="metric-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 17 6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>Maximum</span><strong id="maximum">—</strong></div></section>
  <div id="dashboard-layout" class="dashboard-layout"><div class="primary">
    <section id="chart-panel" class="panel"><div class="panel-header"><h2 id="chart-title" class="panel-title">Consommation quotidienne</h2><div class="panel-heading-tools"><label class="focus-control">Focus<input id="focus-toggle" type="checkbox" checked><span class="focus-switch" aria-hidden="true"></span></label><span class="panel-range"></span><button type="button" class="back hidden">← Retour</button></div></div><svg id="chart" class="chart" viewBox="0 0 900 340" role="img" aria-label="Consommation"></svg></section>
    <section id="list-panel" class="panel hidden"><div class="panel-header"><h2 id="list-title" class="panel-title">Consommation quotidienne</h2><span class="panel-range"></span><button type="button" class="back hidden">← Retour</button></div><table class="daily-list"><thead><tr><th id="first-column">Jour</th><th>Consommation</th></tr></thead><tbody id="daily-list"></tbody></table></section>
  </div></div></div><section id="calendar-panel" class="panel calendar-panel hidden"><div class="panel-header"><h2 class="calendar-title">Calendrier quotidien</h2><div class="panel-heading-tools"><div class="palette-toggle" aria-label="Couleurs du calendrier"><button type="button" data-palette="green" aria-pressed="true">Vert</button><button type="button" data-palette="thermal" aria-pressed="false">Thermique</button></div><span id="calendar-range" class="panel-range"></span></div></div><div id="calendar" class="calendar-months"></div><div class="calendar-legend"><span>Faible</span><span class="calendar-gradient" aria-hidden="true"></span><span>Élevée</span></div></section>
  <div id="status" class="status">Chargement…</div>
</main><script>
const svg=document.querySelector('#chart'),list=document.querySelector('#daily-list'),calendar=document.querySelector('#calendar'),status=document.querySelector('#status'),focusToggle=document.querySelector('#focus-toggle'),groupingSelect=document.querySelector('#grouping'),number=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2}),format=n=>number.format(n)+' kWh',shortDay=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric'}),shortDate=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'}),weekday=new Intl.DateTimeFormat('fr-FR',{weekday:'long'}),calendarDate=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}),monthDate=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}),longDay=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}),svgElement=name=>document.createElementNS('http://www.w3.org/2000/svg',name),asDate=day=>new Date(day+'T12:00:00'),dateKey=date=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
